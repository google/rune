name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only builds and runs tests; it never needs write access.
permissions:
  contents: read

# Cancel superseded runs for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and arm64 Linux.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      # The Makefile expects CTTK and rune to be sibling directories, so check
      # out into a subdirectory of the workspace.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: rune
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            automake autotools-dev bison build-essential clang flex libgmp-dev

      - name: Build and install DataDraw
        run: |
          git clone --depth 1 https://github.com/waywardgeek/datadraw.git
          cd datadraw
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          sudo make install

      - name: Fetch CTTK
        run: |
          git clone --depth 1 https://github.com/pornin/CTTK.git
          cp CTTK/inc/cttk.h CTTK

      - name: Build Rune
        working-directory: rune
        run: make -j"$(nproc)" rune

      - name: Run tests
        working-directory: rune
        run: ./runtests.sh

  build-and-test-macos:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: rune
          persist-credentials: false

      - name: Install system dependencies
        run: brew install bison flex gmp automake autoconf libtool

      # Install into the Homebrew prefix so the Rune Makefile finds DataDraw
      # without sudo.  Apple's bundled bison is too old for DataDraw's grammar.
      - name: Build and install DataDraw
        run: |
          git clone --depth 1 https://github.com/waywardgeek/datadraw.git
          cd datadraw
          export PATH="$(brew --prefix bison)/bin:$PATH"
          ./autogen.sh
          ./configure --prefix="$(brew --prefix)"
          make
          make install

      - name: Fetch CTTK
        run: |
          git clone --depth 1 https://github.com/pornin/CTTK.git
          cp CTTK/inc/cttk.h CTTK

      - name: Build Rune
        working-directory: rune
        run: make -j"$(sysctl -n hw.ncpu)" rune

      - name: Run tests
        working-directory: rune
        run: ./runtests.sh
